<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer pulse ring (representing background execution) -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="16 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.5"/>

  <!-- Pokéball Top Half (Red) -->
  <path d="M 106 256 A 150 150 0 0 1 406 256 Z" fill="url(#redGrad)"/>

  <!-- Pokéball Bottom Half (White) -->
  <path d="M 106 256 A 150 150 0 0 0 406 256 Z" fill="url(#whiteGrad)"/>

  <!-- Center Black Belt -->
  <rect x="106" y="246" width="300" height="20" fill="#0f172a"/>

  <!-- Outer Center Circle -->
  <circle cx="256" cy="256" r="54" fill="#0f172a"/>

  <!-- Middle Center Circle (White) -->
  <circle cx="256" cy="256" r="38" fill="#f8fafc"/>

  <!-- Center Button (Active Glowing Cyan - Background Active Indicator) -->
  <circle cx="256" cy="256" r="22" fill="#0284c7" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#38bdf8"/>

  <!-- Lightning / Pulse Idle Arrow -->
  <path d="M 375 145 L 395 145 L 385 170 L 405 170 L 375 210 L 385 180 L 370 180 Z" fill="#facc15" filter="url(#glow)"/>

  <!-- Background gear mini icon in top left -->
  <circle cx="130" cy="130" r="14" fill="none" stroke="#60a5fa" stroke-width="4"/>
  <path d="M 130 110 L 130 150 M 110 130 L 150 130 M 116 116 L 144 144 M 116 144 L 144 116" stroke="#60a5fa" stroke-width="3"/>
</svg>
